apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: "{{ .Values.database.postgres.name }}"
        image: "{{ .Values.database.postgres.image }}"
        env:
        - name: POSTGRES_DB
          value: "{{ .Values.database.postgres.dbname }}"
        - name: POSTGRES_USER
          value: "{{ .Values.database.postgres.username }}"
        - name: POSTGRES_PASSWORD
          value: "{{ .Values.database.postgres.password }}"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/init-db.sql
          subPath: init-db.sql
      volumes:
      - name: init-script
        configMap:
          name: postgres-init-script
