apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.bus.backend.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ .Values.bus.backend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.bus.backend.name }}
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: {{ .Values.bus.backend.name }}
          image: {{ .Values.bus.image.repository }}:{{ .Values.bus.image.tag }}
          imagePullPolicy: {{ .Values.bus.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.bus.service.port }}

          env:
            # Application Environment
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"

            # Database Configuration
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.database.postgres.name }}:{{ .Values.database.postgres.port }}/{{ .Values.database.postgres.dbname }}"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: postgres-username
            - name: DB_PASSWORD 
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: postgres-password

            # AWS Configuration
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: aws-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: aws-secret-key
            - name: AWS_BUS_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: nandhubus-bucket
            - name: AWS_REGION
              value: "{{ .Values.env.aws.region }}"

            # SMTP Configuration
            - name: SMTP_HOST
              secretKeyRef:
                  name: backend-secrets
                  key: smtp-host
            - name: SMTP_PORT
              secretKeyRef:
                  name: backend-secrets
                  key: smtp-port
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: smtp-username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: smtp-password

            # IMAP Configuration
            - name: IMAP_HOST
              secretKeyRef:
                  name: backend-secrets
                  key: imap-host
            - name: IMAP_PORT
              secretKeyRef:
                  name: backend-secrets
                  key: imap-port
            - name: IMAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: imap-username
            - name: IMAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: imap-password

            # JWT Configuration
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt_secret_key
            - name: JWT_ACCESS_TOKEN_EXPIRE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt-access-token-expire
            - name: JWT_REFRESH_TOKEN_EXPIRE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt-refresh-token-expire

            # Fast2SMS API
            - name: FAST2SMS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: fast2sms-api-id
            - name: FAST2SMS_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: fast2sms-api-url

            # Google Maps API
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: google-map-api-key
            - name: GOOGLE_MAPS_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: google-map-api-url

            # Razorpay API
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: razorpay-api-key-id
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: razorpay-api-key-secret

            # Additional Configurations
            - name: BUS_IMAGE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: bus-image-url
            - name: EMAIL_TEMPLATE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: email-template