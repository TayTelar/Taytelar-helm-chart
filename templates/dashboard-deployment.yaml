apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: kubernetes-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.4.0
        args:
          - "--http-address=0.0.0.0:4180"
          - "--upstream=http://kubernetes-dashboard-api:8000/"
          - "--cookie-secret=$(OAUTH2_PROXY_COOKIE_SECRET)"
          - "--htpasswd-file=/etc/oauth2-proxy/auth-file"
          - "--provider=google"
        env:
          - name: OAUTH2_PROXY_COOKIE_SECRET
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-basic-auth
                key: auth-file
        volumeMounts:
          - name: auth-volume
            mountPath: /etc/oauth2-proxy
      volumes:
        - name: auth-volume
          secret:
            secretName: oauth2-proxy-basic-auth
