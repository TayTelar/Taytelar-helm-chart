apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: kubernetes-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.4.0
        args:
        - --provider=github
        - --email-domain=*
        - --upstream=http://kubernetes-dashboard-web:8000
        - --http-address=0.0.0.0:4180
        - --redirect-url=https://dashboard.taytelar.com/oauth2/callback
        - --cookie-secret=$(OAUTH2_PROXY_COOKIE_SECRET)
        - --client-id=$(OAUTH2_PROXY_CLIENT_ID)
        - --client-secret=$(OAUTH2_PROXY_CLIENT_SECRET)
        envFrom:
        - secretRef:
            name: oauth2-proxy-secret
        ports:
        - containerPort: 4180
        securityContext:
          runAsNonRoot: true
