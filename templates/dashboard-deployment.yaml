apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: kubernetes-dashboard
  annotations:
    oauth2-proxy: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      serviceAccountName: oauth2-proxy
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:latest
        args:
          - --provider=github
          - --client-id=Ov23limwWvGxm8JccUCN
          - --client-secret=2e558089acbe6352a2cb85a318ebb5f83435f977
          - --cookie-secret=6XBTo+6WgE/BKMhdyb4qNb9kFlR16RPIsWPz5OGNwyU=
          - --cookie-secure=false
          - --redirect-url=https://dashboard.taytelar.com/oauth2/callback
          - --upstream=http://kubernetes-dashboard.kubernetes-dashboard.svc.cluster.local:443
          - --http-address=0.0.0.0:4180
        ports:
          - containerPort: 4180
