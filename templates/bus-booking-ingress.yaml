apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.bus.ingress.name }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: bus-ingress-group
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'  
    alb.ingress.kubernetes.io/load-balancer-name: bus-booking-alb
spec:
  ingressClassName: alb
  rules:
    - host: {{ .Values.bus.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.bus.service.name }}
                port:
                  number: {{ .Values.bus.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.nandhubus.frontend.service.name }}
                port:
                  number: {{ .Values.nandhubus.frontend.service.port }}