apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus-redis
  namespace: taytelar-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bus-redis
  template:
    metadata:
      labels:
        app: bus-redis
    spec:
      containers:
        - name: redis
          image: redis:6
          ports:
            - containerPort: 6379
