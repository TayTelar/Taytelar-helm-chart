apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bus-postgres
  template:
    metadata:
      labels:
        app: bus-postgres
    spec:
      containers:
      - name: "{{ .Values.bus.postgres.name }}"
        image: "{{ .Values.bus.postgres.image }}"
        env:
        - name: POSTGRES_DB
          value: "{{ .Values.bus.postgres.dbname }}"
        - name: POSTGRES_USER
          value: "{{ .Values.bus.postgres.username }}"
        - name: POSTGRES_PASSWORD
          value: "{{ .Values.bus.postgres.password }}"
        ports:
        - containerPort: 5433
