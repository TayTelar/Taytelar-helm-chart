apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.database.postgres.name }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-name: "postgres-service"
    external-dns.alpha.kubernetes.io/hostname: "postgres.taytelar.com"
spec:
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: {{ .Values.database.postgres.port }}
      targetPort: 5432
  selector:
    app: postgres
