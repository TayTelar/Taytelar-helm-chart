apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.nandhubus.service.name }}
spec:
  type: {{ .Values.nandhubus.service.type }}
  ports:
    - protocol: TCP
      port: {{ .Values.nandhubus.service.port }}
      targetPort: {{ .Values.nandhubus.service.targetPort }}
  selector:
    app: {{ .Values.nandhubus.backend.name }}