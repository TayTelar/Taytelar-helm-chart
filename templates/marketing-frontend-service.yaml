apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.campaign.frontend.service.name }}
spec:
  type: {{ .Values.campaign.frontend.service.type }}
  ports:
  - protocol: TCP
    port: {{ .Values.campaign.frontend.service.port }}
    targetPort: {{ .Values.campaign.frontend.service.targetPort }}
  selector:
    app: {{ .Values.campaign.frontend.name }}
