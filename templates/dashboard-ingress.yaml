apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-ingress
  namespace: kubernetes-dashboard
  annotations:
    alb.ingress.kubernetes.io/group.name: k8s-dash-alb-ingress-group
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/load-balancer-name: k8s-dash
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: "443"
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTPS
    alb.ingress.kubernetes.io/backend-protocol: HTTPS
    meta.helm.sh/release-namespace: kubernetes-dashboard
    alb.ingress.kubernetes.io/auth-type: oidc
    alb.ingress.kubernetes.io/auth-idp-oidc: '{"Issuer":"https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_SDv8cRkmp","AuthorizationEndpoint":"https://ap-south-1sdv8crkmp.auth.ap-south-1.amazoncognito.com/oauth2/authorize","TokenEndpoint":"https://ap-south-1sdv8crkmp.auth.ap-south-1.amazoncognito.com/oauth2/token","UserInfoEndpoint":"https://ap-south-1sdv8crkmp.auth.ap-south-1.amazoncognito.com/oauth2/userInfo","ClientId":"7okmbe1aitdjb192562utv1ah1","Scope":"openid profile"}'
    alb.ingress.kubernetes.io/auth-on-unauthenticated-request: authenticate
    alb.ingress.kubernetes.io/auth-session-timeout: "3600"
    alb.ingress.kubernetes.io/auth-session-cookie: "AWSELBAuthSessionCookie"
    
spec:
  ingressClassName: alb
  rules:
  - host: dashboard.taytelar.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kubernetes-dashboard-kong-proxy
            port:
              number: 443
