apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-ingress
  namespace: kubernetes-dashboard
  annotations:
    alb.ingress.kubernetes.io/group.name: k8s-dash-alb-ingress-group
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/load-balancer-name: k8s-dash-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:794038231860:certificate/a8ded5d4-3539-43a5-a8cf-532daf5e8c44
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/backend-protocol: HTTPS
    alb.ingress.kubernetes.io/healthcheck-path: "/"
    alb.ingress.kubernetes.io/healthcheck-port: "443"
    
     # OIDC Authentication with Cognito
    alb.ingress.kubernetes.io/auth-type: oidc
    alb.ingress.kubernetes.io/auth-idp-oidc: '{"issuer":"https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_m8c7cJkS4","authorizationEndpoint":"https://ap-south-1m8c7cjks4.auth.ap-south-1.amazoncognito.com/oauth2/authorize","tokenEndpoint":"https://ap-south-1m8c7cjks4.auth.ap-south-1.amazoncognito.com/oauth2/token","userInfoEndpoint":"https://ap-south-1m8c7cjks4.auth.ap-south-1.amazoncognito.com/oauth2/userInfo","clientId":"38pc378spq77rqrlebuid4kgc"}'
    alb.ingress.kubernetes.io/auth-scope: "openid"
    alb.ingress.kubernetes.io/auth-session-cookie: "awsalb-auth"
    alb.ingress.kubernetes.io/auth-session-timeout: "3600"
    alb.ingress.kubernetes.io/auth-on-unauthenticated-request: "authenticate"
    
spec:
  ingressClassName: alb
  rules:
  - host: dashboard.taytelar.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kubernetes-dashboard-kong-proxy
            port:
              number: 443
