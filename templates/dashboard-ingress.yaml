apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-ingress
  namespace: kubernetes-dashboard
  annotations:
    alb.ingress.kubernetes.io/group.name: k8s-dash-alb-ingress-group
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/load-balancer-name: k8s-dash
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: "443"
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTPS
    alb.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: "dashboard-auth"
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
    meta.helm.sh/release-namespace: kubernetes-dashboard
    alb.ingress.kubernetes.io/auth-type: "cognito"
    alb.ingress.kubernetes.io/auth-scope: "openid"
    alb.ingress.kubernetes.io/auth-idp-cognito: "arn:aws:cognito-idp:ap-south-1:794038231860:userpool/ap-south-1_5leylQgE2"
    alb.ingress.kubernetes.io/auth-on-unauthenticated-request: "authenticate"
spec:
  ingressClassName: alb
  rules:
  - host: dashboard.taytelar.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kubernetes-dashboard-kong-proxy
            port:
              number: 443
